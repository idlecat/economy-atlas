[project]
name = "eco-map-pipeline"
version = "0.1.0"
description = "Data pipeline for the Economy Atlas website"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5,<2", "certifi>=2024"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

name: Build data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 3 * *" # monthly, after the IMF's regular IMTS update
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-download all source data"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test pipeline
        run: uv run pytest -q
      # Raw downloads are cached so pushes don't re-download (IMF ~1.5 GB, BACI 2.4 GB).
      # The monthly scheduled run (or a manual run with refresh) fetches everything again.
      - id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            data_raw
            !data_raw/cepii_baci
          key: data-raw-${{ steps.month.outputs.month }}-${{ github.run_id }}
          restore-keys: |
            data-raw-${{ steps.month.outputs.month }}-
            data-raw-
      # BACI (2.4 GB) is a fixed release: cached until the source module (and its VERSION) changes.
      - uses: actions/cache@v4
        with:
          path: data_raw/cepii_baci
          key: baci-${{ hashFiles('pipeline/sources/cepii_baci.py') }}
      - name: Build data files
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            uv run python -m pipeline build --refresh
          else
            uv run python -m pipeline build
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

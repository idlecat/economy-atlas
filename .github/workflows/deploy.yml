name: Build data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 3 * *" # monthly, after the IMF's regular IMTS update
  workflow_dispatch:
    inputs:
      refresh:
        description: "Re-download all source data"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false  # queue: a push must not cancel the monthly refresh

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # a cold build downloads BACI (2.4 GB, often 30+ min) and ~450 IMF files
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Test pipeline
        run: uv run pytest -q
      # Raw downloads are cached so pushes don't re-download (IMF ~1.5 GB, BACI 2.4 GB).
      # The monthly scheduled run (or a manual run with refresh) fetches everything again.
      - id: keys
        run: |
          echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
          echo "baci=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' pipeline/sources/cepii_baci.py)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            data_raw
            !data_raw/cepii_baci
          # one entry per month: a per-run key would store another ~1.5 GB every run and, at
          # GitHub's 10 GB cache limit, evict the BACI cache below
          key: data-raw-${{ steps.keys.outputs.month }}
          restore-keys: |
            data-raw-
      # BACI (2.4 GB) is a fixed release: cached until VERSION in sources/cepii_baci.py changes
      # (not on every edit of that file).
      - uses: actions/cache@v4
        with:
          path: data_raw/cepii_baci
          key: baci-${{ steps.keys.outputs.baci }}
      - name: Build data files
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.refresh }}" = "true" ]; then
            uv run python -m pipeline build --refresh
          else
            uv run python -m pipeline build
          fi
      # A separate page at /ancient/ (prototypes/ancient-crossroads), built from its own sources.
      - name: Build Ancient Crossroads page
        run: uv run python prototypes/ancient-crossroads/build.py --site
      # Story texts quote figures from the data; a refresh that changes one stops the deploy here
      # (the live site keeps the previous build) and lists the sentences to update.
      - name: Check story figures
        run: uv run python -m pipeline check-stories
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Browser smoke test
        run: |
          python3 -m http.server -d site 8000 > /dev/null 2>&1 &
          cd tests/e2e
          npm ci
          npx playwright install --with-deps chromium
          npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
